name: Reality ML-KEM compile check

on:
  push:
    branches:
      - fix/reality-mlkem
  pull_request:
    branches:
      - dev-next

jobs:
  reality-utls:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.7'
          cache: true
      - name: Compile and test uTLS Reality client
        run: go test -tags with_utls ./common/tls
